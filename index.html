<!doctype html>
<html lang="fr">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Bibliothèque RPG</title>
<style>
  :root {
    --bg: #14161b; --panel: #1d2027; --panel2: #242832; --text: #e8e6e1;
    --muted: #9aa0ab; --accent: #d08739; --accent2: #b06f2a; --line: #343946;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { font-family: Georgia, "Times New Roman", serif; background: var(--bg); color: var(--text); }
  header { padding: 28px 24px 18px; border-bottom: 1px solid var(--line); display: flex; flex-wrap: wrap; gap: 16px; align-items: baseline; justify-content: space-between; }
  h1 { font-size: 1.7rem; letter-spacing: .5px; }
  h1 span { color: var(--accent); }
  .subtitle { color: var(--muted); font-style: italic; font-size: .95rem; }
  .controls { padding: 16px 24px; display: flex; flex-wrap: wrap; gap: 10px; align-items: center; border-bottom: 1px solid var(--line); background: var(--panel); }
  input[type="search"] { flex: 1; min-width: 220px; padding: 9px 14px; border-radius: 6px; border: 1px solid var(--line); background: var(--panel2); color: var(--text); font-size: 1rem; }
  .chip { padding: 7px 14px; border-radius: 999px; border: 1px solid var(--line); background: var(--panel2); color: var(--muted); cursor: pointer; font-size: .9rem; }
  .chip.active { background: var(--accent); border-color: var(--accent); color: #14161b; font-weight: bold; }
  .layout { display: grid; grid-template-columns: minmax(300px, 420px) 1fr; gap: 0; min-height: calc(100vh - 120px); }
  @media (max-width: 800px) { .layout { grid-template-columns: 1fr; } #preview { height: 60vh; } }
  #list { border-right: 1px solid var(--line); max-height: calc(100vh - 120px); overflow-y: auto; }
  .doc { padding: 14px 20px; border-bottom: 1px solid var(--line); cursor: pointer; }
  .doc:hover { background: var(--panel); }
  .doc.selected { background: var(--panel2); border-left: 4px solid var(--accent); }
  .doc h3 { font-size: 1.05rem; margin-bottom: 4px; }
  .doc .meta { color: var(--muted); font-size: .82rem; }
  .badge { display: inline-block; font-size: .72rem; text-transform: uppercase; letter-spacing: .8px; color: var(--accent); border: 1px solid var(--accent2); border-radius: 4px; padding: 1px 7px; margin-right: 8px; }
  .dl { margin-top: 8px; font-size: .85rem; color: var(--accent); text-decoration: none; border-bottom: 1px dotted var(--accent2); }
  .dl:hover { color: #f0a85a; }
  #preview { position: relative; }
  #preview iframe { width: 100%; height: 100%; border: 0; background: #2a2e37; }
  #previewHint { position: absolute; inset: 0; display: flex; align-items: center; justify-content: center; color: var(--muted); font-style: italic; padding: 24px; text-align: center; }
  .count { color: var(--muted); font-size: .85rem; padding: 10px 20px; border-bottom: 1px solid var(--line); }
</style>
</head>
<body>

<header>
  <div>
    <h1>Bibliothèque <span>RPG</span></h1>
    <p class="subtitle">Aides de jeu et documents de campagne — clic pour prévisualiser, lien pour télécharger.</p>
  </div>
</header>

<div class="controls">
  <input type="search" id="search" placeholder="Rechercher un document…" />
  <div id="cats"></div>
</div>

<div class="layout">
  <div>
    <div class="count" id="count"></div>
    <div id="list"></div>
  </div>
  <div id="preview">
    <iframe id="viewer" style="display:none" title="Prévisualisation PDF"></iframe>
    <div id="previewHint">Sélectionnez un document pour l'afficher ici.</div>
  </div>
</div>

<script>
/* ============================================================
   CONFIGURATION — c'est ici qu'on ajoute les PDF.
   Déposez vos fichiers PDF à la racine du dépôt, à côté de ce
   fichier index.html, puis ajoutez une entrée par document :
   { titre, categorie, fichier (chemin), description (optionnel) }
   ============================================================ */
const DOCS = [
  { titre: "Alliance des Cendres — présentation", categorie: "Alliance", fichier: "Alliance des Cendres.pdf" },
  { titre: "Constantin Flambeau", categorie: "Personnages", fichier: "Constantin Flambeau.pdf" },
  { titre: "Armand le colosse", categorie: "Personnages", fichier: "Armand le colosse.pdf" },
  { titre: "Aurélie de Garceron", categorie: "Personnages", fichier: "Aurelie de Garceron.pdf" },
  { titre: "Auriana", categorie: "Personnages", fichier: "Auriana.pdf" },
  { titre: "Clotilde Quaesitor", categorie: "Personnages", fichier: "Clotilde Quaesitor.pdf" },
];

/* -------- Rien à modifier ci-dessous -------- */
const searchEl = document.getElementById("search");
const catsEl = document.getElementById("cats");
const listEl = document.getElementById("list");
const countEl = document.getElementById("count");
const viewer = document.getElementById("viewer");
const hint = document.getElementById("previewHint");
let activeCat = "Tous";
let selected = null;

const categories = ["Tous", ...Array.from(new Set(DOCS.map(d => d.categorie)))];

function chips() {
  catsEl.innerHTML = "";
  categories.forEach(c => {
    const b = document.createElement("button");
    b.className = "chip" + (c === activeCat ? " active" : "");
    b.textContent = c;
    b.onclick = () => { activeCat = c; render(); };
    catsEl.appendChild(b);
  });
}

function matches(d) {
  const q = searchEl.value.trim().toLowerCase();
  const okCat = activeCat === "Tous" || d.categorie === activeCat;
  const okQ = !q || (d.titre + " " + (d.description || "") + " " + d.categorie).toLowerCase().includes(q);
  return okCat && okQ;
}

function render() {
  chips();
  listEl.innerHTML = "";
  const shown = DOCS.filter(matches);
  countEl.textContent = shown.length + " document" + (shown.length > 1 ? "s" : "");
  shown.forEach(d => {
    const div = document.createElement("div");
    div.className = "doc" + (selected === d ? " selected" : "");
    div.innerHTML =
      "<h3>" + d.titre + "</h3>" +
      '<div class="meta"><span class="badge">' + d.categorie + "</span>" + (d.description || "") + "</div>" +
      '<a class="dl" href="' + d.fichier + '" download>Télécharger le PDF</a>';
    div.onclick = (e) => {
      if (e.target.tagName === "A") return;
      selected = d;
      viewer.src = d.fichier;
      viewer.style.display = "block";
      hint.style.display = "none";
      render();
    };
    listEl.appendChild(div);
  });
}

searchEl.addEventListener("input", render);
render();
</script>

</body>
</html>
